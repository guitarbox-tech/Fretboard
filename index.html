<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fretboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/style_fb.css">
</head>

<body>
    <div class="button-container">
        <select id="numeroColumnas">
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15" selected>15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="21">21</option>
            <option value="22">22</option>
            <option value="23">23</option>
            <option value="24">24</option>
        </select>

        <!-- <button onclick="cambiarEstiloCirculos()">Cambiar Estilo</button>  -->

        <button id="displayToggle" class="toggle-button">
            <div class="icon-wrapper">
                <svg class="icon" width="16" height="16" viewBox="0 0 24 24">
                    <circle button-icon  cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="1" />
                    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="icon-text"></text>
                </svg>
            </div>
        </button>

        <select id="selectNota">
            <optgroup label="TONALIDADES MAYORES">
                <option value="C" selected>C</option>
                <option value="C♯">C#</option>
                <option value="C♭">C♭</option>
                <option value="D">D</option>
                <option value="D♭">D♭</option>
                <option value="E">E</option>
                <option value="E♭">E♭</option>
                <option value="F">F</option>
                <option value="F♯">F#</option>
                <option value="G">G</option>
                <option value="G♭">G♭</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="B♭">B♭</option>
            </optgroup>
            <optgroup label="TONALIDADES MENORES">
                <option value="A♭m">A♭m</option>
                <option value="E♭m">E♭m</option>
                <option value="B♭m">B♭m</option>
                <option value="Fm">Fm</option>
                <option value="Cm">Cm</option>
                <option value="Gm">Gm</option>
                <option value="Dm">Dm</option>
                <option value="Am">Am</option>
                <option value="Em">Em</option>
                <option value="Bm">Bm</option>
                <option value="F♯m">F♯m</option>
                <option value="C♯m">C♯m</option>
                <option value="G♯m">G♯m</option>
                <option value="D♯m">D♯m</option>
                <option value="A♯m">A♯m</option>
            </optgroup>

        </select>
    </div>

    <table id="miTabla">
        <!-- Las notas musicales se asignarán dinámicamente a través de JavaScript -->
    </table>

    <script src="js/script_fb.js"></script>

</body>

</html>
